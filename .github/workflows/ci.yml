name: CI

on: [push, pull_request]

jobs:
  test:
    # ubuntu-latest moved to 26.04, which has no setup-python build of
    # 3.8/3.9 - those matrix rows die before a test runs.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest
      # tiny-validator is not on PyPI yet, so the schema-aware loader's
      # dependency is installed straight from the repo, pinned to a commit
      # SHA rather than a branch so the build cannot drift.
      - name: Install tiny-validator
        run: pip install "git+https://github.com/hussain-alsaibai/tiny-validator.git@432f142a4318b246c06e1f7e98c0fa85c3aeb868"
      # Every test file must be named here. test_v042_secret_heuristic.py
      # was written for 0.4.2 and left off this line, so the 9 tests that
      # justify the masking fix never ran in CI.
      - run: >
          python -m pytest
          test_tiny_config.py
          test_v040_serialization.py
          test_v042_secret_heuristic.py
          test_llms_drift.py
          test_version_consistency.py
          test_typed.py
          -v
