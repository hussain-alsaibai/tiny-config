[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-config"
version = "0.4.0"
description = "Zero-dependency configuration loader for Python. JSON / YAML / INI / .env / CLI flags — one call."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [{name = "OpenClaw", email = "hussain.alsaibai@gmail.com"}]
keywords = ["config", "configuration", "settings", "env", "yaml", "json", "ini", "dotenv"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
